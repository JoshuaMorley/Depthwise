name: Build APK

# Builds the app on every push/PR, and publishes a GitHub Release when a version tag is pushed:
#   git tag v1.2.0 && git push origin v1.2.0
#
# Version numbers
#   versionCode  = workflow run number (always increases, so installs upgrade cleanly)
#   versionName  = 1.2.0 for tag v1.2.0; otherwise <last tag>-dev.<run>+<commit>, e.g. 1.2.0-dev.57+a1b2c3d
#
# Signing (optional, recommended): add these repository secrets to get a signed release APK
# that can update itself between builds. Without them a debug APK is built instead.
#   ANDROID_KEYSTORE_BASE64    base64 of your .jks/.keystore file
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_ALIAS
#   ANDROID_KEY_PASSWORD

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # to create releases on tags

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tags are needed for the version name

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3
        with:
          # The default also installs the obsolete "tools" package, which no longer exists.
          # AGP downloads the platform/build-tools it needs itself.
          packages: platform-tools
          log-accepted-android-sdk-licenses: false

      - uses: gradle/actions/setup-gradle@v4

      - name: Work out version
        id: version
        shell: bash
        run: |
          code=${{ github.run_number }}
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            name="${GITHUB_REF_NAME#v}"
          else
            last=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || echo "v0.1.0")
            name="${last#v}-dev.${code}+$(git rev-parse --short HEAD)"
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "Version $name (code $code)"

      - name: Set up signing key
        id: signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "type=release" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No signing secrets set; building a debug APK. Add ANDROID_KEYSTORE_* secrets for signed releases."
            echo "type=debug" >> "$GITHUB_OUTPUT"
          fi

      - name: Unit tests
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest

      - name: Build APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          task=assembleDebug
          [ "${{ steps.signing.outputs.type }}" = "release" ] && task=assembleRelease
          ./gradlew --no-daemon "$task" \
            -PappVersionCode=${{ steps.version.outputs.code }} \
            -PappVersionName=${{ steps.version.outputs.name }}

      - name: Name APK after its version
        id: apk
        shell: bash
        run: |
          type=${{ steps.signing.outputs.type }}
          src=$(ls app/build/outputs/apk/$type/*.apk | head -n 1)
          safe=$(echo "${{ steps.version.outputs.name }}" | tr '+/' '__')
          suffix=""
          [ "$type" = "debug" ] && suffix="-debug"
          out="NZ-LINZ-${safe}${suffix}.apk"
          mkdir -p dist && cp "$src" "dist/$out"
          # Fixed-name copy so https://github.com/<repo>/releases/latest/download/NZ-LINZ.apk always works.
          cp "$src" dist/NZ-LINZ.apk
          echo "path=dist/$out" >> "$GITHUB_OUTPUT"
          echo "file=$out" >> "$GITHUB_OUTPUT"
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.file }}
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.apk.outputs.path }}
            dist/NZ-LINZ.apk
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
